services:
  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_USERS_NAME:-ms_users}
      POSTGRES_USER: ${DB_USERS_USER:-ms_users_app}
      POSTGRES_PASSWORD: ${DB_USERS_PASSWORD:-ms_users_pass}
    volumes:
      - pg-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERS_USER:-ms_users_app} -d ${DB_USERS_NAME:-ms_users}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-security:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_SECURITY_NAME:-ms_security}
      POSTGRES_USER: ${DB_SECURITY_USER:-ms_security_app}
      POSTGRES_PASSWORD: ${DB_SECURITY_PASSWORD:-ms_security_pass}
    volumes:
      - pg-security-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SECURITY_USER:-ms_security_app} -d ${DB_SECURITY_NAME:-ms_security}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-audit:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_AUDIT_NAME:-ms_audit}
      POSTGRES_USER: ${DB_AUDIT_USER:-ms_audit_app}
      POSTGRES_PASSWORD: ${DB_AUDIT_PASSWORD:-ms_audit_pass}
    volumes:
      - pg-audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_AUDIT_USER:-ms_audit_app} -d ${DB_AUDIT_NAME:-ms_audit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      # A JVM-based check here (e.g. kafka-broker-api-versions) is too slow/
      # flaky under Docker's default healthcheck timeout and, in Zookeeper
      # mode, its legacy AdminClient can fail outright with a METADATA
      # request disconnect even when the broker is otherwise healthy. A
      # plain TCP probe is enough: it confirms the broker is accepting
      # connections, which is all `depends_on: condition: service_healthy`
      # needs — Spring Kafka's own producer/consumer already retry.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  ms-users:
    build:
      context: ./ms-users
    environment:
      SERVER_PORT: 8081
      DB_USERS_HOST: db-users
      DB_USERS_PORT: 5432
      DB_USERS_NAME: ${DB_USERS_NAME:-ms_users}
      DB_USERS_USER: ${DB_USERS_USER:-ms_users_app}
      DB_USERS_PASSWORD: ${DB_USERS_PASSWORD:-ms_users_pass}
      MS_SECURITY_JWKS_URI: http://ms-security:8082/.well-known/jwks.json
      APP_VAADIN_ORIGIN: ${APP_VAADIN_ORIGIN:-http://localhost:8080}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      db-users:
        condition: service_healthy

  ms-security:
    build:
      context: ./ms-security
    environment:
      SERVER_PORT: 8082
      DB_SECURITY_HOST: db-security
      DB_SECURITY_PORT: 5432
      DB_SECURITY_NAME: ${DB_SECURITY_NAME:-ms_security}
      DB_SECURITY_USER: ${DB_SECURITY_USER:-ms_security_app}
      DB_SECURITY_PASSWORD: ${DB_SECURITY_PASSWORD:-ms_security_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_PRIVATE_KEY_PEM: ${APP_JWT_PRIVATE_KEY_PEM:-}
      APP_JWT_PUBLIC_KEY_PEM: ${APP_JWT_PUBLIC_KEY_PEM:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-10}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_VAADIN_ORIGIN: ${APP_VAADIN_ORIGIN:-http://localhost:8080}
      MS_USERS_BASE_URL: http://ms-users:8081
      AUDIT_TOPIC: ${AUDIT_TOPIC:-audit}
    ports:
      - "8082:8082"
    depends_on:
      db-security:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ms-audit:
    build:
      context: ./ms-audit
    environment:
      SERVER_PORT: 8083
      DB_AUDIT_HOST: db-audit
      DB_AUDIT_PORT: 5432
      DB_AUDIT_NAME: ${DB_AUDIT_NAME:-ms_audit}
      DB_AUDIT_USER: ${DB_AUDIT_USER:-ms_audit_app}
      DB_AUDIT_PASSWORD: ${DB_AUDIT_PASSWORD:-ms_audit_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MS_SECURITY_JWKS_URI: http://ms-security:8082/.well-known/jwks.json
      AUDIT_TOPIC: ${AUDIT_TOPIC:-audit}
      APP_VAADIN_ORIGIN: ${APP_VAADIN_ORIGIN:-http://localhost:8080}
    ports:
      - "8083:8083"
    depends_on:
      db-audit:
        condition: service_healthy
      kafka:
        condition: service_healthy

  app-vaadin:
    build:
      context: ./app-vaadin
    environment:
      SERVER_PORT: 8080
      MS_USERS_BASE_URL: http://ms-users:8081
      MS_SECURITY_BASE_URL: http://ms-security:8082
      MS_AUDIT_BASE_URL: http://ms-audit:8083
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      - ms-users
      - ms-security
      - ms-audit

volumes:
  pg-users-data:
  pg-security-data:
  pg-audit-data:
