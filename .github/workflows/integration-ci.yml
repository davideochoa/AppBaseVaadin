name: Integration CI

# Brings up the full docker-compose stack (all 4 modules + their
# databases + Kafka) and runs a real end-to-end smoke test over the
# actual Docker network: bootstrap-admin login against ms-security,
# then that token against ms-users' resource server. This is the one
# thing the per-module CI workflows (ms-users-ci.yml, ms-security-ci.yml,
# ms-audit-ci.yml, app-vaadin-ci.yml) can't catch on their own, since
# each of them tests its module in isolation.

on:
  push:
    branches: ["**"]
    paths:
      - "ms-users/**"
      - "ms-security/**"
      - "ms-audit/**"
      - "app-vaadin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "ms-users/**"
      - "ms-security/**"
      - "ms-audit/**"
      - "app-vaadin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/integration-ci.yml"

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for ms-users, ms-security, ms-audit health endpoints
        run: |
          for port in 8081 8082 8083; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/actuator/health" || true)
              if [ "$status" = "200" ]; then
                echo "Port $port is healthy."
                break
              fi
              if [ "$i" = "60" ]; then
                echo "Port $port never became healthy after 10 minutes."
                exit 1
              fi
              sleep 10
            done
          done

      - name: Wait for ms-security JWKS endpoint
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/.well-known/jwks.json || true)
            if [ "$status" = "200" ]; then
              echo "JWKS is reachable."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "JWKS never became reachable."
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test - bootstrap admin login + cross-service JWT validation
        run: |
          set -e
          response=$(curl -s -X POST http://localhost:8082/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}')
          echo "Login response: $response"

          token=$(echo "$response" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "No access token in login response."
            exit 1
          fi

          status=$(curl -s -o /tmp/users_response.json -w '%{http_code}' \
            http://localhost:8081/users \
            -H "Authorization: Bearer $token")
          echo "GET /users response: $(cat /tmp/users_response.json)"

          if [ "$status" != "200" ]; then
            echo "Expected 200 from GET /users with a bootstrap-admin token, got $status."
            exit 1
          fi

      - name: Dump service logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
