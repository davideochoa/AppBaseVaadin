name: app-vaadin CI

on:
  push:
    branches: ["**"]
    paths:
      - "app-vaadin/**"
      - ".github/workflows/app-vaadin-ci.yml"
  pull_request:
    paths:
      - "app-vaadin/**"
      - ".github/workflows/app-vaadin-ci.yml"

defaults:
  run:
    working-directory: app-vaadin

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --update-snapshots clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-vaadin-surefire-reports
          path: app-vaadin/target/surefire-reports
          if-no-files-found: ignore
