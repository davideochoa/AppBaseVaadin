server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: app-vaadin

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  clients:
    ms-users-base-url: ${MS_USERS_BASE_URL:http://localhost:8081}
    ms-security-base-url: ${MS_SECURITY_BASE_URL:http://localhost:8082}
    ms-audit-base-url: ${MS_AUDIT_BASE_URL:http://localhost:8083}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
